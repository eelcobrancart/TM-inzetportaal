  De XLSX-generator schrijft tekst als inline strings en uren als numerieke cellen.
  Er worden geen externe scripts, lettertypen, trackers of netwerkverzoeken gebruikt.
-->
<script id="domain">
'use strict';
const PortalCore = (() => {
 const STATUS={pending:'In behandeling',info:'Aanvulling nodig',approved:'Goedgekeurd',rejected:'Afgewezen',withdrawn:'Ingetrokken'};
 const LOCATIONS=['Amsterdam','Haarlem','Rotterdam'];
 const PERIODS=['P1','P2','P3','P4'];
 const CATEGORIES=['Onderwijs & begeleiding','Toetsing & beoordeling','Onderwijsontwikkeling','Organisatie & coördinatie','Overig'];
 const YEAR='2026–2027';
 const clone = x => JSON.parse(JSON.stringify(x));
 const uid=()=>globalThis.crypto?.randomUUID?.() || 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
 const sum=(rows,key)=>Math.round(rows.reduce((n,r)=>n+(Number(r[key])||0),0)*100)/100;
 function hours(value) {
  const s=String(value??'').trim();
  if(!/^\d{1,4}(?:[.,]\d{1,2})?$/.test(s)) throw Error('Vul een geldig aantal DBU’s in, bijvoorbeeld 8 of 2,5.');
  const n=Number(s.replace(',','.'));
  if(!Number.isFinite(n)||n<=0||n>500) throw Error('Het aantal DBU’s moet groter dan 0 en maximaal 500 zijn.');
  return n;
 }
 function textValue(value,label,min,max) {
  const s=String(value??'').trim();
  if(s.length<min) throw Error(label+' moet minimaal '+min+' tekens bevatten.');
  if(s.length>max) throw Error(label+' mag maximaal '+max+' tekens bevatten.');
  return s;
 }
 function actor(db,session,role) {
  const u=db.users.find(u=>u.id===session.userId&&u.role===session.role);
  if(!u || (role&&u.role!==role)) throw Error('Deze actie is niet beschikbaar voor deze demorol.');
  return u;
 }
 function visible(db,session) { const u=actor(db,session); return db.requests.filter(r=>u.role==='manager'||r.userId===u.id); }
 function get(db,session,id) {
  const r=visible(db,session).find(r=>r.id===id);
  if(!r) throw Error('Deze aanvraag is niet beschikbaar in deze omgeving.');
  return r;
 }
 function audit(db,session,r,action,note,at,changes={}) {
  const u=actor(db,session);
  db.events.push({id:uid(),requestId:r?.id||null,actorId:u.id,actor:u.name,action,note,at,changes});
 }
 function checkRevision(r,revision) {
  if(r.revision!==revision) throw Error('Deze aanvraag is intussen gewijzigd. Sluit dit venster en open de aanvraag opnieuw.');
 }
 function create(db,session,input,at=new Date().toISOString()) {
  const u=actor(db,session,'teacher');
  const task=textValue(input.task,'De taak',3,120);
  const reason=textValue(input.reason,'De onderbouwing',20,2000);
  const requested=hours(input.hours);
  if(!LOCATIONS.includes(input.location)||!PERIODS.includes(input.period)||!CATEGORIES.includes(input.category)) throw Error('Kies een geldige locatie, periode en categorie.');
  const serial=Math.max(0,...db.requests.map(r=>r.serial))+1;
  const r={id:'TM-2026-'+String(serial).padStart(3,'0'),serial,userId:u.id,task,reason,requested,approved:null,location:input.location,period:input.period,category:input.category,year:YEAR,status:'pending',createdAt:at,updatedAt:at,decidedAt:null,decidedBy:null,revision:1};
  db.requests.push(r);audit(db,session,r,'Aanvraag ingediend',reason,at,{from:null,to:'pending',requested});
  return r;
 }
 function decide(db,session,id,revision,input,at=new Date().toISOString()) {
  actor(db,session,'manager');const r=get(db,session,id);checkRevision(r,revision);
  if(!['pending','info'].includes(r.status)) throw Error('Over deze aanvraag is al een definitief besluit genomen.');
  if(!['approved','rejected','info'].includes(input.decision)) throw Error('Kies een besluit.');
  let approved=null, note=String(input.note??'').trim();
  if(input.decision==='approved') {
   approved=hours(input.hours);
   if(approved>r.requested) throw Error('Je kunt niet meer DBU’s toekennen dan zijn aangevraagd.');
   if(approved!==r.requested) note=textValue(note,'De toelichting bij een aangepaste toekenning',10,2000);
   else if(note.length>2000) throw Error('De toelichting mag maximaal 2000 tekens bevatten.');
  } else note=textValue(note,input.decision==='info'?'Je vraag aan de docent':'De reden van afwijzing',10,2000);
  const before=r.status;r.status=input.decision;r.approved=approved;r.updatedAt=at;r.revision++;
  r.decidedAt=['approved','rejected'].includes(r.status)?at:null;
  r.decidedBy=r.decidedAt?session.userId:null;
  const title=r.status==='approved'?'Aanvraag goedgekeurd':r.status==='rejected'?'Aanvraag afgewezen':'Aanvullende informatie gevraagd';
  audit(db,session,r,title,note,at,{from:before,to:r.status,requested:r.requested,approved});
  return r;
 }
 function respond(db,session,id,revision,note,at=new Date().toISOString()) {
  actor(db,session,'teacher');const r=get(db,session,id);checkRevision(r,revision);
  if(r.status!=='info') throw Error('Deze aanvraag wacht niet op aanvullende informatie.');
  note=textValue(note,'Je aanvulling',10,2000);r.status='pending';r.updatedAt=at;r.revision++;
  audit(db,session,r,'Aanvulling verstuurd',note,at,{from:'info',to:'pending'});
  return r;
 }
 function withdraw(db,session,id,revision,at=new Date().toISOString()) {
  actor(db,session,'teacher');const r=get(db,session,id);checkRevision(r,revision);
  if(!['pending','info'].includes(r.status)) throw Error('Deze aanvraag kan niet meer worden ingetrokken.');
  const before=r.status;r.status='withdrawn';r.updatedAt=at;r.revision++;
  audit(db,session,r,'Aanvraag ingetrokken','De docent heeft de aanvraag ingetrokken.',at,{from:before,to:'withdrawn'});
  return r;
 }
 function recordExport(db,session,ids,at=new Date().toISOString()) {
  actor(db,session,'manager');
  const rows=visible(db,session).filter(r=>ids.includes(r.id)&&r.status==='approved');
  if(!rows.length||rows.length!==new Set(ids).size) throw Error('Selecteer uitsluitend goedgekeurde aanvragen voor de export.');
  audit(db,session,null,'Excel-export gemaakt',rows.length+' goedgekeurde aanvragen, '+sum(rows,'approved')+' DBU’s.',at,{requestIds:rows.map(r=>r.id),total:sum(rows,'approved')});
 }
 function seed() {
  const db={schema:1,users:[
   {id:'noor',name:'Noor de Vries',location:'Haarlem',role:'teacher'},
   {id:'bram',name:'Bram Vermeer',location:'Amsterdam',role:'teacher'},
   {id:'lina',name:'Lina Smit',location:'Rotterdam',role:'teacher'},
   {id:'sam',name:'Sam de Wit',location:'Haarlem',role:'teacher'},
   {id:'alex',name:'Alex Jansen',location:'Alle locaties',role:'manager'}
  ],requests:[],events:[]};
  const m={userId:'alex',role:'manager'};
  function add(userId,task,h,period,cat,reason,date) {
   const u=db.users.find(u=>u.id===userId);
   return create(db,{userId,role:'teacher'},{task,hours:h,period,category:CATEGORIES[cat],reason,location:u.location},'2026-10-'+date+'T08:30:00.000Z');
  }
  add('noor','Workshop duurzaam toerisme',8,'P2',2,'Een extra workshop ontwikkelen en verzorgen voor jaar 2. Vier uur voorbereiding, twee uur uitvoering en twee uur afstemming met de opdrachtgever.','28');
  const n2=add('noor','Extra begeleiding projectgroep',12,'P2',0,'De projectgroep heeft aanvullende begeleiding nodig bij de onderzoeksopzet en het contact met de werkveldpartner. Hiervoor zijn extra coachmomenten nodig.','24');
  decide(db,m,n2.id,n2.revision,{decision:'info',note:'Kun je het aantal extra coachgesprekken en de verwachte voorbereidingstijd per gesprek toelichten?'},'2026-10-27T13:15:00.000Z');
  const n3=add('noor','Kalibratiesessie Final Track',6,'P1',1,'Voorbereiding en deelname aan een aanvullende kalibratiesessie met de beoordelaars van het Final Track. De sessie staat buiten de bestaande inzet.','18');
  decide(db,m,n3.id,n3.revision,{decision:'approved',hours:6,note:'Akkoord. De extra kalibratiesessie draagt bij aan een gelijkwaardige beoordeling.'},'2026-10-20T09:20:00.000Z');
  const n4=add('noor','Deelname facultaire bijeenkomst',4,'P1',3,'Deelname aan de facultaire bijeenkomst over samenwerking tussen opleidingen, inclusief voorbereiding en terugkoppeling naar het team.','14');
  decide(db,m,n4.id,n4.revision,{decision:'rejected',note:'Deze bijeenkomst valt binnen de al toegekende uren voor teamoverleg. Daarom zijn hiervoor geen aanvullende DBU’s beschikbaar.'},'2026-10-16T11:00:00.000Z');
  add('bram','Organisatie werkveldbezoek',10,'P2',3,'Een bezoek aan een lokale toeristische organisatie voorbereiden: contact met de partner, programma-afstemming en begeleiding van de studentengroep.','27');
  add('lina','Doorontwikkeling minorprogramma',16,'P3',2,'Een nieuwe casus over inclusief toerisme uitwerken en bijbehorend lesmateriaal ontwikkelen voor het minorprogramma in semester 2.','26');
  const s=add('sam','Beoordelen extra herkansingen',9,'P1',1,'Er zijn drie extra herkansingsdossiers binnengekomen. De aanvraag omvat het lezen van de dossiers, beoordeling en afstemming met de tweede beoordelaar.','21');
  decide(db,m,s.id,s.revision,{decision:'approved',hours:8,note:'Acht DBU’s toegekend. Eén uur afstemming is al opgenomen in de bestaande inzet voor kalibratie.'},'2026-10-22T14:30:00.000Z');
  const b=add('bram','Extra intakegesprekken jaar 3',6,'P1',0,'Zes aanvullende intakegesprekken met studenten voor hun stagevoorbereiding, inclusief het doornemen en terugkoppelen van de individuele plannen.','12');
  decide(db,m,b.id,b.revision,{decision:'approved',hours:6,note:'Akkoord voor de zes extra intakegesprekken.'},'2026-10-13T10:00:00.000Z');
  const l=add('lina','Workshop datavaardigheden',12,'P2',2,'Een aanvullende praktijkworkshop over datavaardigheden voorbereiden en verzorgen, gericht op de analyse van bezoekersgegevens.','23');
  decide(db,m,l.id,l.revision,{decision:'info',note:'Kun je aangeven welke onderdelen aanvullend zijn op het huidige lesprogramma en hoe je de uren verdeelt?'},'2026-10-27T10:20:00.000Z');
  return db;
 }
 return {STATUS,LOCATIONS,PERIODS,CATEGORIES,YEAR,clone,uid,sum,hours,visible,get,create,decide,respond,withdraw,recordExport,seed};
})();
</script>

<script id="excel">
'use strict';
const ExcelExport = (() => {
 const enc=new TextEncoder();
 const xml=s=>String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
 const crcTable=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=(n&1)?0xedb88320^(n>>>1):n>>>1;return n>>>0;});
 function crc32(a){let c=0xffffffff;for(const b of a)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0;}
 function column(n){let s='';do{s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)-1;}while(n>=0);return s;}
 function zip(files) {
  const locals=[],centers=[];let offset=0;
  const header=(n)=>{const a=new Uint8Array(n);return[a,new DataView(a.buffer)];};
  for(const [path,body]of files){
   const name=enc.encode(path),data=enc.encode(body),crc=crc32(data);
   const [lh,l]=header(30+name.length);l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x800,true);l.setUint16(12,0x5d5e,true);l.setUint32(14,crc,true);l.setUint32(18,data.length,true);l.setUint32(22,data.length,true);l.setUint16(26,name.length,true);lh.set(name,30);
   locals.push(lh,data);
   const [ch,c]=header(46+name.length);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(14,0x5d5e,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,offset,true);ch.set(name,46);centers.push(ch);offset+=lh.length+data.length;
  }
  const size=centers.reduce((s,a)=>s+a.length,0);const[end,e]=header(22);e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,offset,true);
  return new Blob([...locals,...centers,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 }
 function sheet(rows) {
  const last=column(rows[0].length-1)+rows.length;
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:'+last+'"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="24"/><cols>'+rows[0].map((v,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(i===5?45:i>=12?65:i===1?24:19)+'" customWidth="1"/>').join('')+'</cols><sheetData>'+rows.map((row,ri)=>'<row r="'+(ri+1)+'">'+row.map((v,ci)=>{const ref=column(ci)+(ri+1);if(typeof v==='number'&&Number.isFinite(v))return '<c r="'+ref+'" s="2"><v>'+v+'</v></c>';return '<c r="'+ref+'" s="'+(ri===0?1:0)+'" t="inlineStr"><is><t xml:space="preserve">'+xml(v)+'</t></is></c>';}).join('')+'</row>').join('')+'</sheetData><autoFilter ref="A1:'+last+'"/></worksheet>';
 }
 function workbook(sheets) {
  const files=[
   ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>'],
   ['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
   ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>'+sheets.map((s,i)=>'<sheet name="'+xml(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'],
   ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
   ['xl/styles.xml','<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.##"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFCF006B"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"><alignment vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>']
  ];
  sheets.forEach((s,i)=>files.push(['xl/worksheets/sheet'+(i+1)+'.xml',sheet(s.rows)]));return zip(files);
 }
 return {workbook};
})();
</script>
<script id="app">
'use strict';
(() => {
 const C=PortalCore,$=s=>document.querySelector(s);
 const KEY='tm-inzetportaal.offline-demo.v1';
 const ICONS={
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',

  spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>',
  shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>',
  group:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M17 15a5 5 0 0 1 4 5"/>'
 };
 const icon=(name,cls='')=>'<svg class="'+cls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||ICONS.file)+'</svg>';
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const nf=new Intl.NumberFormat('nl-NL',{maximumFractionDigits:2});
 const num=n=>nf.format(n);
 const df=new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'short',year:'numeric',timeZone:'Europe/Amsterdam'});
 const dtf=new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Amsterdam'});
 const date=s=>s?df.format(new Date(s)):'—';
 const datetime=s=>s?dtf.format(new Date(s)):'—';
 const initials=s=>s.split(' ').filter(Boolean).filter((x,i,a)=>i===0||i===a.length-1).map(x=>x[0]).join('').toUpperCase();
 let storageOK=true,storageMessage='',storageWriteBlocked=false;
 function validDb(d){return d&&d.schema===1&&Array.isArray(d.users)&&d.users.length===5&&Array.isArray(d.requests)&&Array.isArray(d.events)&&d.requests.every(r=>C.STATUS[r.status]&&d.users.some(u=>u.id===r.userId)&&Number.isFinite(r.requested)&&Number.isInteger(r.revision));}
 function readStored() {
  try{
   const raw=localStorage.getItem(KEY);
   if(!raw)return null;
   const parsed=JSON.parse(raw);
   if(!validDb(parsed))throw Error('Ongeldig demoformaat');
   return parsed;
  }catch(e){storageOK=false;storageWriteBlocked=true;storageMessage='De opgeslagen demo kon niet worden gelezen. De oorspronkelijke opslag blijft ongewijzigd. Je werkt tijdelijk met voorbeeldgegevens; wijzigingen worden niet bewaard. Via “Hoe werkt dit?” kun je de demo bewust opnieuw beginnen.';return null;}
 }
 let db=readStored()||C.seed();
 function persist(next) {
  db=next;
  // Bewaar onleesbare bestaande opslag tot de gebruiker expliciet voor herstel kiest.
  if(storageWriteBlocked)return;
  try{localStorage.setItem(KEY,JSON.stringify(next));storageOK=true;storageMessage='';}

  '<div class="field"><label for="period">Periode<em>*</em></label><select id="period" name="period" required>'+options(C.PERIODS,d.period)+'</select></div>'+
  '<div class="field"><label for="location">Locatie van de werkzaamheden<em>*</em></label><select id="location" name="location" required>'+options(C.LOCATIONS,d.location)+'</select></div>'+
  '<div class="field full"><div class="field-row"><label for="reason">Onderbouwing<em>*</em></label><small id="reason-count">'+d.reason.length+'/2000</small></div><textarea id="reason" name="reason" required minlength="20" maxlength="2000" placeholder="Wat ga je doen, waarom is dit extra werk en hoe zijn de uren opgebouwd?" aria-describedby="reason-help">'+esc(d.reason)+'</textarea><small id="reason-help">Minimaal 20 tekens. Gebruik in dit prototype uitsluitend fictieve informatie.</small></div></div>'+
  '<div id="form-error" class="error-box" role="alert" tabindex="-1"></div><div class="form-actions"><small>Na het indienen is je aanvraag zichtbaar voor de teamleider. Je kunt de voortgang volgen bij Mijn aanvragen.</small><button class="button primary" type="submit">'+icon('send')+'Aanvraag indienen</button></div></form></section>'+
  '<aside class="form-aside"><section class="panel summary"><h2>Jouw aanvraag</h2><div class="summary-item"><span>Docent</span><strong>'+esc(user().name)+'</strong></div><div class="summary-item"><span>Collegejaar</span><strong>'+C.YEAR+'</strong></div><div class="summary-item"><span>Locatie</span><strong id="summary-location">'+esc(d.location)+'</strong></div><div class="summary-item"><span>Periode</span><strong id="summary-period">'+esc(d.period)+'</strong></div><div class="summary-total"><div class="eyebrow">Extra aangevraagde uren</div><div class="number"><span id="summary-hours">0</span> <small>DBU’s</small></div><p>Je teamleider beoordeelt je aanvraag.</p></div></section><div class="tip"><h3>'+icon('spark')+'Een heldere aanvraag helpt</h3><p>Maak onderscheid tussen voorbereiding, uitvoering en afronding. Licht toe welke werkzaamheden buiten je bestaande inzet vallen.</p></div></aside></div>';
 }
 function updateSummary() {
  const d=currentDraft();if($('#summary-location'))$('#summary-location').textContent=d.location;
  if($('#summary-period'))$('#summary-period').textContent=d.period;
  if($('#summary-hours')){let n=0;try{n=C.hours(d.hours);}catch{}$('#summary-hours').textContent=num(n);}
  if($('#reason-count'))$('#reason-count').textContent=d.reason.length+'/2000';
 }
 function refreshResults(){
  if(page==='requests')$('#list-results').innerHTML=requestResults();
  else if(page==='approved'){
   $('#list-results').innerHTML=approvedResults();const rows=filtered(own().filter(r=>r.status==='approved'));
   const el=$('[data-action="export"]');if(el)el.disabled=!rows.length;
   const stats=document.querySelectorAll('.stats .stat');if(stats[2]){stats[2].querySelector('.stat-value').textContent=num(rows.length);stats[2].querySelector('.stat-caption').textContent=num(C.sum(rows,'approved'))+' DBU’s voor de export';}
  }else if(page==='history')$('#list-results').innerHTML=historyResults();
 }
 function showDialog(html,kind) {
  if(!$('#dialog').open)lastFocus=document.activeElement;
  $('#dialog').innerHTML=html;currentDialog=kind;
  if(!$('#dialog').open)$('#dialog').showModal();
 }
 function closeDialog(){
  $('#dialog').close();currentDialog=null;
  if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});
 }
 function detail(id) {
  const r=C.get(db,session,id),u=requestUser(r),manager=session.role==='manager',events=db.events.filter(e=>e.requestId===r.id).sort((a,b)=>b.at.localeCompare(a.at));
  let html='<div class="modal-head"><div><div class="eyebrow">'+r.id+' · '+C.YEAR+'</div><h2 id="dialog-title">'+esc(r.task)+'</h2></div><button class="icon-button" data-action="close-dialog" aria-label="Venster sluiten">'+icon('close')+'</button></div><div class="modal-body">'+badge(r.status)+
  '<dl class="detail-facts"><div><dt>Docent</dt><dd>'+esc(u.name)+'</dd></div><div><dt>Locatie / periode</dt><dd>'+esc(r.location)+' · '+r.period+'</dd></div><div><dt>Aangevraagd</dt><dd>'+num(r.requested)+' DBU’s</dd></div><div><dt>Toegekend</dt><dd>'+(r.approved!==null?num(r.approved)+' DBU’s':'Nog niet toegekend')+'</dd></div></dl>'+
  '<div class="detail-section"><h3>Onderbouwing</h3><p class="pre">'+esc(r.reason)+'</p><p class="small" style="margin-top:12px">'+esc(r.category)+' · Ingediend op '+date(r.createdAt)+'</p></div>';
  if(manager&&['pending','info'].includes(r.status))html+=reviewForm(r);
  if(!manager&&r.status==='info') {
   const question=events.find(e=>e.changes?.to==='info');
   html+='<div class="review-box"><h3>Je teamleider heeft een vraag</h3><div class="event-note" style="margin:0 0 17px">'+esc(question?.note||'Geef een aanvullende toelichting bij je aanvraag.')+'</div><form id="response-form" data-id="'+r.id+'" data-revision="'+r.revision+'"><div class="field"><label for="response-note">Jouw aanvulling<em>*</em></label><textarea id="response-note" name="note" required minlength="10" maxlength="2000" placeholder="Geef hier de gevraagde toelichting…"></textarea><small>Minimaal 10 tekens. Je aanvraag gaat daarna terug naar de teamleider.</small></div><div class="error-box" id="dialog-error" role="alert" tabindex="-1"></div><div class="review-footer"><button class="button primary" type="submit">'+icon('send')+'Aanvulling versturen</button></div></form></div>';
  }
  html+='<section class="modal-history"><h3>Historie van deze aanvraag</h3>'+events.map(e=>eventHtml(e)).join('')+'</section><div class="modal-footer">'+(!manager&&['pending','info'].includes(r.status)?button('Aanvraag intrekken','withdraw','close',false,'data-id="'+r.id+'" data-revision="'+r.revision+'"'):'<span class="muted small">Besluiten blijven zichtbaar in de historie.</span>')+button('Sluiten','close-dialog',null)+'</div></div>';
  showDialog(html,{kind:'detail',id});updateDecision();
 }
 function reviewForm(r) {
  return '<section class="review-box"><h3>Beoordeling</h3><form id="review-form" data-id="'+r.id+'" data-revision="'+r.revision+'"><fieldset class="decision-options"><legend class="sr-only">Kies je besluit</legend>'+[['approved','Goedkeuren'],['info','Informatie vragen'],['rejected','Afwijzen']].map(([v,l])=>'<label><input type="radio" name="decision" value="'+v+'"'+(v==='approved'?' checked':'')+'>'+l+'</label>').join('')+'</fieldset><div class="review-fields"><div class="field" id="approved-field"><label for="approved-hours">Toe te kennen DBU’s<em>*</em></label><input id="approved-hours" name="hours" inputmode="decimal" required maxlength="7" value="'+num(r.requested)+'"><small>Maximaal '+num(r.requested)+' DBU’s.</small></div><div class="field" id="review-note-field"><label for="review-note" id="review-note-label">Toelichting (optioneel)</label><textarea id="review-note" name="note" maxlength="2000" placeholder="Licht je besluit toe…"></textarea><small id="review-note-help">Bij een lager aantal DBU’s is een toelichting verplicht.</small></div></div><div class="error-box" id="dialog-error" role="alert" tabindex="-1"></div><div class="review-footer"><button class="button primary" type="submit" id="review-submit">'+icon('check')+'Goedkeuren</button></div></form></section>';
 }
 function updateDecision() {
  const form=$('#review-form');if(!form)return;
  const decision=form.querySelector('input[name="decision"]:checked').value,approve=decision==='approved';
  $('#approved-field').hidden=!approve;$('#approved-hours').disabled=!approve;
  $('#review-note-field').style.gridColumn=approve?'':'1/-1';
  const r=C.get(db,session,form.dataset.id);
  let partial=false;try{partial=approve&&C.hours($('#approved-hours').value)!==r.requested;}catch{}
  $('#review-note').required=!approve||partial;$('#review-note').minLength=!approve||partial?10:0;
  $('#review-note-label').textContent=approve?(partial?'Toelichting bij aangepaste DBU’s *':'Toelichting (optioneel)'):decision==='info'?'Je vraag aan de docent *':'Reden van afwijzing *';
  $('#review-note-help').textContent=approve?'Bij een lager aantal DBU’s is een toelichting van minimaal 10 tekens verplicht.':'Minimaal 10 tekens. Deze toelichting is zichtbaar voor de docent.';
  $('#review-submit').innerHTML=icon(approve?'check':decision==='info'?'message':'close')+(approve?'Goedkeuren':decision==='info'?'Vraag versturen':'Aanvraag afwijzen');
 }
 function help() {
  const html='<div class="modal-head"><div><div class="eyebrow">Welkom in het prototype</div><h2 id="dialog-title">Zo werkt TM Inzetportaal</h2></div><button class="icon-button" data-action="close-dialog" aria-label="Venster sluiten">'+icon('close')+'</button></div><div class="modal-body help-content"><p>Eén plek voor extra werkzaamheden, je aanvraag en het besluit van de teamleider.</p><ol><li>Kies bovenaan de rol <strong>Docent</strong> en een fictieve docent.</li><li>Maak een <strong>Nieuwe aanvraag</strong> of reageer op een vraag bij Mijn aanvragen.</li><li>Wissel naar <strong>Teamleider</strong> om goed te keuren, af te wijzen of aanvullende informatie te vragen.</li><li>Download de goedgekeurde wijzigingen via <strong>Goedgekeurd & export</strong>. Het Excelbestand bevat de selectie en de bijbehorende historie.</li></ol><h3>Bewaren in je browser</h3><p>Wijzigingen worden lokaal bewaard wanneer je browser dit toestaat. Open het bestand opnieuw op dezelfde plek, met dezelfde browser. Verplaatsen van het bestand, privémodus of wissen van browsergegevens kan de opgeslagen demo verwijderen. Het HTML-bestand zelf verandert niet en gegevens worden niet tussen apparaten of collega’s gedeeld.</p><div class="notice"><strong>Alleen fictieve gegevens</strong><p>De rollenwissel is een demonstratie en biedt geen beveiligde toegang. Alle demogegevens staan in dit bestand en in de browser. Gebruik nog geen echte personeelsgegevens. Voor echte inzet zijn veilige aanmelding, serveropslag en toegangscontrole per rol en gebruiker nodig.</p></div><h3>Verder ontwikkelen</h3><p>De aanvraaglogica, opslag en schermen zijn in de broncode gescheiden. De code bevat aanwijzingen voor een volgende versie met instellings-SSO en gecontroleerde toegang via een server.</p><div class="modal-footer"><button class="button danger" data-action="reset-confirm">'+icon('history')+'Demo opnieuw beginnen</button>'+button('Aan de slag','close-dialog','arrow',true)+'</div></div>';
  showDialog(html,{kind:'help'});
 }
 function confirmReset() {
  showDialog('<div class="modal-head"><h2 id="dialog-title">Demo opnieuw beginnen?</h2><button class="icon-button" data-action="close-dialog" aria-label="Venster sluiten">'+icon('close')+'</button></div><div class="modal-body"><p>Je eigen demo-aanvragen, reacties en besluiten in deze browser worden verwijderd. De oorspronkelijke fictieve voorbeelden komen terug.</p><div class="modal-footer">'+button('Annuleren','help',null)+button('Ja, demo herstellen','reset','history',true)+'</div></div>',{kind:'reset'});
 }
 function confirmWithdraw(id,revision) {
  const r=C.get(db,session,id);
  showDialog('<div class="modal-head"><h2 id="dialog-title">Aanvraag intrekken?</h2><button class="icon-button" data-action="close-dialog" aria-label="Venster sluiten">'+icon('close')+'</button></div><div class="modal-body"><p>Je trekt <strong>'+esc(r.task)+'</strong> in. De aanvraag blijft zichtbaar in de historie en wordt niet meer beoordeeld.</p><div id="dialog-error" class="error-box" role="alert" tabindex="-1"></div><div class="modal-footer">'+button('Annuleren','open',null,false,'data-id="'+id+'"')+button('Ja, intrekken','withdraw-confirm','close',true,'data-id="'+id+'" data-revision="'+revision+'"')+'</div></div>',{kind:'withdraw',id});
 }
 function exportExcel() {
  if(session.role!=='manager')return;
  const rows=byNewest(filtered(own().filter(r=>r.status==='approved')));
  if(!rows.length)return;
  const headers=['Aanvraag-ID','Docent (fictief)','Locatie','Collegejaar','Periode','Taak / werkzaamheden','Categorie','Aangevraagde DBU’s','Toegekende DBU’s','Status','Besluitdatum','Besloten door (fictief)','Besluit / toelichting','Onderbouwing'];
  const cells=rows.map(r=>{const ev=db.events.filter(e=>e.requestId===r.id&&e.changes?.to==='approved').sort((a,b)=>b.at.localeCompare(a.at))[0];return[r.id,requestUser(r).name,r.location,r.year,r.period,r.task,r.category,r.requested,r.approved,C.STATUS[r.status],datetime(r.decidedAt),db.users.find(u=>u.id===r.decidedBy)?.name||'',ev?.note||'',r.reason];});
  const ids=new Set(rows.map(r=>r.id));
  const hist=db.events.filter(e=>ids.has(e.requestId)).sort((a,b)=>a.at.localeCompare(b.at)).map(e=>[e.requestId,datetime(e.at),e.actor,e.action,e.note,e.changes?.from?C.STATUS[e.changes.from]:'',e.changes?.to?C.STATUS[e.changes.to]:'',e.changes?.requested??'',e.changes?.approved??'']);
  const blob=ExcelExport.workbook([{name:'Goedgekeurde wijzigingen',rows:[headers,...cells]},{name:'Historie selectie',rows:[['Aanvraag-ID','Tijdstip (Nederland)','Door (fictief)','Gebeurtenis','Toelichting','Oude status','Nieuwe status','Aangevraagde DBU’s','Toegekende DBU’s'],...hist]},{name:'Leeswijzer',rows:[['Onderwerp','Toelichting'],['TM Inzetportaal','Prototype — uitsluitend fictieve gegevens'],['Inhoud','Alleen goedgekeurde aanvragen uit de gekozen filters. Bedragen zijn extra DBU’s.'],['Collegejaar',C.YEAR],['Export gemaakt',datetime(new Date().toISOString())],['Aantal aanvragen',rows.length],['Totaal toegekende DBU’s',C.sum(rows,'approved')],['Locatiefilter',filter.location==='all'?'Alle locaties':filter.location],['Periodefilter',filter.period==='all'?'Alle periodes':filter.period],['Zoekfilter',filter.q||'Geen'],['Verwerking','Controleer aanvraag-ID’s op eerdere verwerking voordat je uren overneemt in de Mastersheet.'],['Tijdstippen','Europe/Amsterdam; datums worden als leesbare tekst geëxporteerd.']]}]);
  const now=new Date(),filename='TM-goedgekeurde-wijzigingen-'+now.toISOString().slice(0,10)+'.xlsx';
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  Store.transaction(next=>C.recordExport(next,session,rows.map(r=>r.id)));
  render();toast('Excelbestand klaargezet: '+rows.length+' aanvragen, '+num(C.sum(rows,'approved'))+' DBU’s.');
 }
 function closeMenu(){$('#sidebar').classList.remove('open');$('#mobile-shade').classList.remove('show');$('#menu-toggle').setAttribute('aria-expanded','false');}
 function formError(id,error){const el=$(id);if(el){el.textContent=error.message||String(error);el.focus();}else toast(error.message||String(error));}
 document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-action]');if(!el||el.disabled)return;
  if(el.dataset.role){if(el.dataset.role===session.role)return;if(session.role==='teacher')lastTeacherId=session.userId;session={role:el.dataset.role,userId:el.dataset.role==='manager'?'alex':lastTeacherId};closeDialog();navigate('overview');return;}
  if(el.dataset.page){navigate(el.dataset.page);return;}
  if(el.dataset.status){filter.status=el.dataset.status;render();return;}
  const action=el.dataset.action;if(!action)return;
  try{
   if(action==='teacher-home'){e.preventDefault();if(session.role==='teacher')lastTeacherId=session.userId;session={role:'teacher',userId:lastTeacherId};closeDialog();navigate('overview');return;}
   if(['new','overview','requests','approved','history'].includes(action)){navigate(action);return;}
   if(action==='open')detail(el.dataset.id);
   else if(action==='close-dialog')closeDialog();
   else if(action==='help')help();
   else if(action==='export')exportExcel();
   else if(action==='clear-filters'){filter={status:'all',q:'',location:'all',period:'all'};render();}
   else if(action==='menu'){const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#mobile-shade').classList.toggle('show',open);$('#menu-toggle').setAttribute('aria-expanded',String(open));}
   else if(action==='close-menu')closeMenu();
   else if(action==='reset-confirm')confirmReset();
   else if(action==='reset'){Store.reset();drafts={};session={role:'teacher',userId:'noor'};lastTeacherId='noor';lastCreated='';closeDialog();navigate('overview');toast('De oorspronkelijke fictieve demo is hersteld.');}
   else if(action==='withdraw')confirmWithdraw(el.dataset.id,Number(el.dataset.revision));
   else if(action==='withdraw-confirm'){Store.transaction(next=>C.withdraw(next,session,el.dataset.id,Number(el.dataset.revision)));closeDialog();render(true);toast('Aanvraag ingetrokken. De historie blijft beschikbaar.');}
  }catch(err){formError($('#dialog').open?'#dialog-error':'#form-error',err);}
 });
 document.addEventListener('change',e=>{
  if(e.target.id==='user-select'){session.userId=e.target.value;if(session.role==='teacher')lastTeacherId=session.userId;closeDialog();navigate('overview');}
  else if(e.target.id==='location-filter'){filter.location=e.target.value;refreshResults();}
  else if(e.target.id==='period-filter'){filter.period=e.target.value;refreshResults();}
  else if(e.target.name==='decision')updateDecision();
  else if(e.target.closest('#request-form')){currentDraft()[e.target.name]=e.target.value;updateSummary();}
 });
 document.addEventListener('input',e=>{
  if(e.target.id==='search-input'){filter.q=e.target.value;refreshResults();}
  else if(e.target.closest('#request-form')&&e.target.name){currentDraft()[e.target.name]=e.target.value;updateSummary();}
  else if(e.target.id==='approved-hours')updateDecision();
 });
 document.addEventListener('submit',e=>{
  const form=e.target;
  if(!['request-form','review-form','response-form'].includes(form.id))return;
  e.preventDefault();
  const data=Object.fromEntries(new FormData(form)),submit=form.querySelector('[type="submit"]');
  try{
   submit.disabled=true;
   if(form.id==='request-form'){
    const r=Store.transaction(next=>C.create(next,session,data));delete drafts[session.userId];lastCreated=r.id;navigate('requests');
    toast('Aanvraag '+r.id+' ingediend. Je teamleider kan deze nu beoordelen.');
   }else if(form.id==='review-form'){
    const r=Store.transaction(next=>C.decide(next,session,form.dataset.id,Number(form.dataset.revision),data));
    closeDialog();render(true);toast(r.status==='approved'?'Aanvraag goedgekeurd: '+num(r.approved)+' DBU’s toegekend.':r.status==='info'?'Je vraag staat klaar bij de docent.':'Aanvraag afgewezen. De toelichting is zichtbaar voor de docent.');
   }else{
    Store.transaction(next=>C.respond(next,session,form.dataset.id,Number(form.dataset.revision),data.note));closeDialog();render(true);toast('Aanvulling verstuurd. Je aanvraag is opnieuw in behandeling.');
   }
  }catch(err){submit.disabled=false;formError(form.id==='request-form'?'#form-error':'#dialog-error',err);}
 });
 $('#dialog').addEventListener('cancel',()=>{currentDialog=null;});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
 window.addEventListener('storage',e=>{
  if(e.key!==KEY)return;
  const loaded=readStored();if(loaded){db=loaded;render();toast('De demogegevens zijn bijgewerkt vanuit een ander tabblad.');}
 });
 render();
})();
</script>
</body>
</html>
